<article class="story-card glass-panel"><a href="{{ story.get_absolute_url }}" class="card-image" tabindex="-1" aria-hidden="true">{% if story.featured_image %}<img src="{{ story.featured_image.image.url }}" alt="{{ story.featured_image.alt_text }}" loading="lazy" width="800" height="500">{% else %}<div class="image-placeholder"><span>{{ story.category.name }}</span><b>LN.</b></div>{% endif %}</a><div class="card-copy"><div class="card-topline"><span class="story-kicker">{{ story.category.name }}{% if story.breaking %} · Live{% endif %}</span><span class="card-arrow">↗</span></div><h3><a href="{{ story.get_absolute_url }}">{{ story.title }}</a></h3><p>{{ story.summary|truncatewords:20 }}</p><div class="meta"><span>{{ story.published_at|date:'d M Y' }}</span><span>{{ story.reading_minutes }} min read</span></div></div></article>
